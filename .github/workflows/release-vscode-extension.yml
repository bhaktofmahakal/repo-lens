name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to VS Code Marketplace (requires VSCE_PAT secret)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run extension smoke tests
        working-directory: vscode-extension
        run: npm run test

      - name: Read extension version
        id: version
        working-directory: vscode-extension
        run: |
          node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;fs.appendFileSync(process.env.GITHUB_OUTPUT,'value='+v+'\\n');"

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: repolens-vscode-${{ steps.version.outputs.value }}
          path: vscode-extension/repolens-vscode-${{ steps.version.outputs.value }}.vsix

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is required for publishing."
            exit 1
          fi
          npx @vscode/vsce publish --packagePath repolens-vscode-${{ steps.version.outputs.value }}.vsix --pat "$VSCE_PAT"
